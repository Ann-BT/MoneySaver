<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Coin Glow -->
    <radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Coin Golden Gradient -->
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Coin Inner Ring Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Vault Face Gradient -->
    <linearGradient id="vaultFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b23" />
      <stop offset="100%" stop-color="#091e18" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Gloss Stroke -->
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="url(#glossGrad)" stroke-width="2.5" />

  <!-- Coin Ambient Glow behind coin -->
  <circle cx="256" cy="180" r="130" fill="url(#coinGlow)" />

  <!-- Gold Coin (Dropping into slot) -->
  <g filter="url(#coinShadow)">
    <!-- Outer Coin Edge -->
    <ellipse cx="256" cy="185" rx="84" ry="84" fill="url(#goldGrad)" stroke="url(#goldRim)" stroke-width="5" />
    <!-- Inner Rim Detail -->
    <ellipse cx="256" cy="185" rx="68" ry="68" fill="none" stroke="#fef08a" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6 4" />
    
    <!-- Coin Icon: Stylized Growth Upward Chevron / Spark -->
    <path d="M256 142 L282 178 L266 178 L266 216 L246 216 L246 178 L230 178 Z" fill="#78350f" fill-opacity="0.8" />
    <path d="M256 138 L284 176 L267 176 L267 214 L245 214 L245 176 L228 176 Z" fill="#fef9c3" />
  </g>

  <!-- Vault Face Front (Overlaps lower half of coin) -->
  <path d="M 80 236 
           C 80 216, 96 200, 116 200 
           L 396 200 
           C 416 200, 432 216, 432 236 
           L 432 404 
           C 432 426, 414 444, 392 444 
           L 120 444 
           C 98 444, 80 426, 80 404 
           Z" 
        fill="url(#vaultFace)" 
        stroke="#10b981" 
        stroke-opacity="0.35" 
        stroke-width="2" />

  <!-- Vault Slot (Deposit Slit) -->
  <rect x="156" y="218" width="200" height="20" rx="10" fill="#02140e" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Vault Screws / Bolts Accent -->
  <circle cx="106" cy="226" r="5" fill="#34d399" fill-opacity="0.4" />
  <circle cx="406" cy="226" r="5" fill="#34d399" fill-opacity="0.4" />
  <circle cx="106" cy="418" r="5" fill="#34d399" fill-opacity="0.4" />
  <circle cx="406" cy="418" r="5" fill="#34d399" fill-opacity="0.4" />

  <!-- Vault Dial (Modern Clean Dial) -->
  <g transform="translate(256, 336)">
    <circle cx="0" cy="0" r="48" fill="#042118" stroke="#10b981" stroke-width="3" stroke-opacity="0.5" />
    <circle cx="0" cy="0" r="36" fill="#064e3b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="0" cy="0" r="14" fill="#10b981" />
    <rect x="-3" y="-30" width="6" height="12" rx="3" fill="#34d399" />
    <rect x="-3" y="18" width="6" height="12" rx="3" fill="#34d399" fill-opacity="0.5" />
    <rect x="-30" y="-3" width="12" height="6" rx="3" fill="#34d399" fill-opacity="0.5" />
    <rect x="18" y="-3" width="12" height="6" rx="3" fill="#34d399" fill-opacity="0.5" />
  </g>
</svg>